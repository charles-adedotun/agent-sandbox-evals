[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox-evals"
version = "0.1.0"
description = "Empirical AI agent sandbox containment evaluation benchmark suite (Host vs Filtered MCP vs Container)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Charles Adedotun", email = "charles@krysp.org" }
]
keywords = [
    "ai-safety",
    "agent-containment",
    "sandbox-benchmark",
    "ai-control",
    "mcp-security",
    "ssrf-prevention"
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agent-sandbox-evals = "agent_sandbox_evals.cli:app"
eval-sandbox = "agent_sandbox_evals.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_sandbox_evals"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

